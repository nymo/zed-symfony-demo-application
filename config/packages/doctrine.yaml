parameters:
    env(DATABASE_URL): 'sqlite:///%kernel.project_dir%/var/data.db'

doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: false
        mappings:
            Member:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Member/Entity'
                prefix: 'App\Member\Entity'
            Catalog:
                type: yml
                is_bundle: false
                dir: '%kernel.project_dir%/config/doctrine/yaml'
                prefix: 'App\Catalog\Entity'
            Geography:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/config/doctrine/xml'
                prefix: 'App\Geography\Entity'
